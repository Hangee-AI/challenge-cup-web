name: Deploy to Surge

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Stage static files
        run: |
          mkdir -p dist
          cp index.html dist/
          cp -r css js dist/
          if [ -d assets ]; then cp -r assets dist/; fi
          ls -la dist

      # 凭据来源：优先用仓库 Secrets（更安全）；
      # 未配置 Secrets 时回退到下面这组账号（仓库是 Private，仅供本项目使用）。
      # 以后想更安全，到 Settings → Secrets and variables → Actions 添加：
      #   SURGE_LOGIN = 321328179@qq.com
      #   SURGE_TOKEN = <surge token>
      - name: Deploy to Surge
        env:
          SURGE_LOGIN: ${{ secrets.SURGE_LOGIN || '321328179@qq.com' }}
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN || '3ea6672944905cebc0d34709cc35b591' }}
        run: |
          echo "deploying as $SURGE_LOGIN"
          # 主域名：yinlu.surge.sh（「引路」）
          npx --yes surge dist yinlu.surge.sh
          # 过渡期保留旧域名，避免已发出的链接失效；稳定后可删掉这一行
          npx --yes surge dist guoguan.surge.sh
          echo "deploy done"
