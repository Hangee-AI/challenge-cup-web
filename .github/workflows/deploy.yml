name: Deploy to Surge

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Stage static files
        run: |
          mkdir -p dist
          cp index.html dist/
          cp -r css js assets dist/

      - name: Check Surge credentials
        env:
          SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: |
          if [ -z "$SURGE_LOGIN" ] || [ -z "$SURGE_TOKEN" ]; then
            echo "::error::缺少 SURGE_LOGIN / SURGE_TOKEN，请在仓库 Settings → Secrets and variables → Actions 中配置"
            exit 1
          fi

      - name: Deploy to Surge
        env:
          SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: npx --yes surge dist guoguan.surge.sh
