<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>小引 · 桌面宠物（换装单文件版）</title>

<!--
==========================================================================
  小引桌面宠物 · 阶段 2：换装模块（单文件版）
  -------------------------------------------------------------------------
  【本文件只做这一阶段的事】
    ✅ 已在阶段 1 具备、本文件全部保留：
         · 小头像 ↔ 大熊 两种形态切换
         · 拖拽（小头像拖动移动整个挂件；大熊单独拖动，互不干扰）
         · 眼睛跟随鼠标（见 JS: followEyes —— 用整只熊的透视偏转实现，
           不依赖素材里瞳孔的具体位置，换成你自己的 PNG 也不会错位）
         · 闲置缩回小头像（见 JS: startIdleWatch，默认 12 秒）
    ✅ 本阶段新增：
         · 点大熊弹换装面板（4 个分类：肤色 / 眼镜 / 围巾 / 外套）
         · 一键随机搭配（配饰允许随机为「不佩戴」）
         · localStorage 持久化（刷新/重开网页自动还原）

  ❌ 本文件刻意【不包含】（留给后续阶段，别在这里加）：
         · 任何时间判断 / 早白晚黑自动换肤色
         · 唤醒台词、鼓励语气泡
         · AI 聊天框（小引·学习搭子）

  ---------------------------------------------------------------------------
  【图片替换说明 · 重要】
  本文件里所有图片都是「占位注释 + 空 <img>」，没有内嵌任何成品图。
  你只需要准备好一批【尺寸完全一致、透明背景、原点（左上角）对齐】的 PNG，
  放到 assets/pet/ 下，再把下面 ASSETS 表里对应项的注释去掉、填上路径即可。

  尺寸要求：同一套素材必须是同一个画布尺寸（推荐 512 × 600 或 600 × 700），
  小熊本体、围巾、外套、眼镜全部画在同一张画布的位置上，
  这样 4 张 <img> 直接叠在一起就是「穿上」的效果，不需要任何位移计算。

  ASSETS 结构（键名 = 选项目录，值 = 图片路径；留空则显示 CSS 灰色占位块）：
    body    肤色本体（必选，4 款，永远显示）     z-index: 0
    scarf   围巾（可「不佩戴」）                 z-index: 1
    jacket  外套（可「不佩戴」）                 z-index: 2
    glasses 眼镜（可「不佩戴」，永远最上层）      z-index: 3

  注意：严格禁止「拼好的成品大图 + 整图切换」——
        换装必须靠上面 4 个独立 <img> 图层叠加实现。
==========================================================================
-->

<style>
  /* ========== 基础 ========== */
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: linear-gradient(180deg, #f7f9ff 0%, #eef2fb 100%);
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    color: #1b2140;
  }
  /* 页面里放一点示例文字，方便你看到「宠物浮在网页上」的层级关系；接入真站点时可删掉 */
  .page { max-width: 720px; margin: 0 auto; padding: 80px 24px; }
  .page h1 { font-size: 30px; margin: 0 0 12px; }
  .page p { line-height: 1.9; color: #5b6480; margin: 0 0 10px; }
  .page code { background: #eef1fa; border-radius: 6px; padding: 2px 6px; font-size: 13px; }

  /* ==========================================================
     一、宠物挂件根节点（fixed 定位，跟着网页滚动不动）
     ========================================================== */
  .pet {
    position: fixed;
    right: 26px;
    bottom: 26px;
    z-index: 9998;
    /* 根节点本身不占空间，所有子元素用绝对定位挂在它身上 */
    width: 0;
    height: 0;
    font-size: 14px;
    user-select: none;
    -webkit-user-select: none;
  }

  /* ==============================
     二、小头像形态（默认）
     ============================== */
  .pet-mini {
    position: absolute;
    right: 0;
    bottom: 0;
    width: 84px;
    height: 84px;
    border: none;
    padding: 0;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 10px 26px rgba(30, 43, 90, .18);
    cursor: grab;
    overflow: hidden;
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .pet-mini:hover { transform: translateY(-2px) scale(1.03); box-shadow: 0 14px 30px rgba(30, 43, 90, .24); }
  .pet-mini:active { cursor: grabbing; }

  /* 小头像里的「头」：把本体图层放大并上移，只露出头部（圆形裁切）*/
  .pet-mini .mini-head {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 200%;
    height: 200%;
    transform: translate(-50%, -58%);
    pointer-events: none;
  }
  .pet-mini .mini-head img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }
  /* 小头像的「没有图片时的 CSS 占位头」。替换真图后这个元素会被自动隐藏 */
  .pet-mini .mini-ph {
    position: absolute;
    left: 50%;
    top: 54%;
    width: 46px;
    height: 42px;
    transform: translate(-50%, -50%);
    background: var(--skin-color, #2b2b33);
    border-radius: 46% 46% 48% 48% / 52% 52% 44% 44%;
    box-shadow: inset 0 -6px 0 rgba(255, 255, 255, .12);
  }
  .pet-mini .mini-ph::before,
  .pet-mini .mini-ph::after {
    /* 两只耳朵 */
    content: "";
    position: absolute;
    top: -10px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--skin-color, #2b2b33);
  }
  .pet-mini .mini-ph::before { left: -3px; }
  .pet-mini .mini-ph::after { right: -3px; }

  /* ==============================
     三、大熊形态（点小头像后出现）
     ============================== */
  .pet-big {
    position: absolute;
    right: 0;
    bottom: 96px;          /* 站到小头像上方 */
    width: 260px;
    height: 300px;
    cursor: grab;
    touch-action: none;
    /* 眼睛跟随：由 JS 写入 --ry / --rx 两个角度变量 */
    transform: perspective(760px) rotateY(var(--ry, 0deg)) rotateX(var(--rx, 0deg));
    transform-style: preserve-3d;
    transition: transform .12s linear;
  }
  .pet-big:active { cursor: grabbing; }
  .pet-big[hidden] { display: none !important; }

  /* ---------- 3.1 图层容器：小熊本体固定 relative，四张图完全重合 ---------- */
  .pet-stage {
    position: relative;            /* 强制规则：本体是一个 relative 容器 */
    width: 100%;
    height: 100%;
  }
  /*
    四个图层：绝对定位、宽高 100%、左上角原点对齐。
    因为你的素材都是「同一画布、同尺寸、透明背景」，所以只要都铺满 100%，
    坐标天然重合，配饰就正好落在该落的位置，不需要 top/left 偏移。
  */
  .pet-layer {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;       /* 保持比例，避免拉伸变形 */
    pointer-events: none;      /* 图层不吃鼠标事件，拖拽统一由 .pet-big 处理 */
    display: block;
  }
  /* 图层顺序（严格按需求固定，不要改） */
  .layer-body    { z-index: 0; }  /* 肤色本体：必选、永远显示 */
  .layer-scarf   { z-index: 1; }  /* 围巾 */
  .layer-jacket  { z-index: 2; }  /* 外套 */
  .layer-glasses { z-index: 3; }  /* 眼镜：永远最上层，不会被围巾/外套遮挡 */
  .pet-layer[hidden] { display: none !important; }

  /* ---------- 3.2 没有图片时的 CSS 占位（换真图后自动隐藏） ---------- */
  .pet-ph { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
  /* 占位身体：站立的胖胖身体（真图换上后整块隐藏） */
  .pet-ph .ph-body {
    position: absolute;
    left: 50%;
    bottom: 8%;
    width: 62%;
    height: 52%;
    transform: translateX(-50%);
    background: var(--skin-color, #2b2b33);
    border-radius: 46% 46% 34% 34% / 40% 40% 60% 60%;
  }
  /* 占位头：圆脸 + 两只耳朵 */
  .pet-ph .ph-head {
    position: absolute;
    left: 50%;
    top: 12%;
    width: 40%;
    height: 26%;
    transform: translateX(-50%);
    background: var(--skin-color, #2b2b33);
    border-radius: 50%;
  }
  .pet-ph .ph-head::before,
  .pet-ph .ph-head::after {
    content: "";
    position: absolute;
    top: -18%;
    width: 34%;
    height: 34%;
    border-radius: 50%;
    background: var(--skin-color, #2b2b33);
  }
  .pet-ph .ph-head::before { left: -6%; }
  .pet-ph .ph-head::after { right: -6%; }
  .pet-ph .ph-scarf,
  .pet-ph .ph-jacket,
  .pet-ph .ph-glasses {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    display: none;
  }
  .pet-ph .ph-scarf   { top: 34%; width: 56%; height: 14%; border-radius: 10px; background: #b9c2d8; }
  .pet-ph .ph-jacket  { top: 44%; width: 72%; height: 34%; border-radius: 22px 22px 16px 16px; background: #8fa3c8; }
  .pet-ph .ph-glasses { top: 18%; width: 40%; height: 8%;  border-radius: 8px; background: #3a4256; }
  /* 有占位时按当前穿搭把对应色块显示出来，方便你看到「层叠」效果 */
  .pet-stage.is-placeholder .ph-scarf   { display: block; }
  .pet-stage.is-placeholder .ph-jacket  { display: block; }
  .pet-stage.is-placeholder .ph-glasses { display: block; }
  .pet-stage:not(.is-placeholder) .pet-ph { display: none; }

  /* ==========================================================
     四、换装面板
     ========================================================== */
  .wardrobe {
    position: absolute;
    right: 274px;            /* 站在大熊左侧 */
    bottom: 96px;
    width: 300px;
    max-height: 62vh;
    overflow: auto;
    background: #fff;
    border: 1px solid #e7eaf3;
    border-radius: 18px;
    box-shadow: 0 18px 50px rgba(30, 43, 90, .18);
    padding: 14px 14px 16px;
    z-index: 10000;
  }
  .wardrobe[hidden] { display: none !important; }
  .wd-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .wd-title { font-weight: 700; font-size: 15px; }
  .wd-close {
    border: none; background: #f2f4fb; color: #5b6480;
    width: 26px; height: 26px; border-radius: 8px; cursor: pointer; font-size: 15px; line-height: 1;
  }
  .wd-close:hover { background: #e7ebf7; }

  .wd-group { margin-top: 12px; }
  .wd-group-title { font-size: 12px; color: #8b93a8; margin-bottom: 7px; }
  .wd-row { display: flex; flex-wrap: wrap; gap: 8px; }

  /* 选项按钮 */
  .wd-opt {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 11px;
    border: 1px solid #e4e8f2;
    background: #fff;
    border-radius: 11px;
    font-size: 13px;
    color: #3d4560;
    cursor: pointer;
    transition: all .15s ease;
  }
  .wd-opt:hover { border-color: #c6d2f2; background: #f7f9ff; }
  .wd-opt.is-on {
    border-color: #4f6ef7;
    background: #eef2ff;
    color: #2c46c8;
    font-weight: 600;
  }
  .wd-opt .dot {
    width: 14px; height: 14px; border-radius: 50%;
    border: 1px solid rgba(0,0,0,.12);
    flex: 0 0 auto;
  }
  .wd-opt .none-mark { font-size: 12px; color: #a3aabb; }

  .wd-foot { display: flex; gap: 8px; margin-top: 16px; }
  .wd-btn {
    flex: 1;
    padding: 9px 10px;
    border-radius: 11px;
    border: 1px solid #e4e8f2;
    background: #fff;
    font-size: 13px;
    color: #3d4560;
    cursor: pointer;
  }
  .wd-btn:hover { background: #f7f9ff; }
  .wd-btn.primary {
    background: #4f6ef7;
    border-color: #4f6ef7;
    color: #fff;
    font-weight: 600;
  }
  .wd-btn.primary:hover { background: #4462e8; }

  /* ==========================================================
     五、小提示（浏览器里第一次打开时的操作说明，可删）
     ========================================================== */
  .pet-tip {
    position: fixed;
    right: 26px;
    bottom: 120px;
    max-width: 210px;
    padding: 10px 12px;
    background: #1b2140;
    color: #fff;
    font-size: 12px;
    line-height: 1.7;
    border-radius: 12px;
    z-index: 9997;
    box-shadow: 0 12px 30px rgba(27, 33, 64, .28);
  }
  .pet-tip[hidden] { display: none !important; }
  .pet-tip::after {
    content: "";
    position: absolute;
    right: 30px;
    bottom: -6px;
    width: 12px; height: 12px;
    background: #1b2140;
    transform: rotate(45deg);
  }
  .pet-tip b { color: #a9b9ff; }
</style>
</head>
<body>

<!-- 页面示例内容（接入真网站时删掉这一段即可） -->
<div class="page">
  <h1>小熊桌面宠物 · 换装单文件版</h1>
  <p>右下角是小头像。点它 → 变成大熊；点大熊 → 弹换装面板。</p>
  <p>按住<b>小头像</b>拖动 = 移动整个挂件；按住<b>大熊</b>拖动 = 只移动大熊。</p>
  <p>长时间不动（12 秒）会自动缩回小头像；双击大熊回到默认位置。</p>
  <p>素材替换位置见本文件顶部的 <code>ASSETS</code> 注释表。</p>
</div>

<!-- ============================================================
     宠物挂件
     ============================================================ -->
<div class="pet" id="pet">

  <!-- ---------- 小头像（默认形态） ---------- -->
  <button class="pet-mini" id="petMini" title="点我变大熊（可拖动）">
    <!-- 小头像用「本体图层放大裁切」实现，不需要单独素材；
         如果你想给小头像单独一张图，把下面 img 的 src 填成 head_xxx 即可 -->
    <span class="mini-head">
      <!-- [占位] 小头像专用图（可选）：
           src="assets/pet/head-black.png" -->
      <img id="miniHeadImg" alt="小头像" />
    </span>
    <!-- 没有图片时的 CSS 占位头 -->
    <span class="mini-ph" id="miniPh" aria-hidden="true"></span>
  </button>

  <!-- ---------- 大熊（点小头像后出现） ---------- -->
  <div class="pet-big" id="petBig" hidden title="拖动我；点我换装；双击回位">
    <div class="pet-stage" id="petStage">

      <!-- 没有图片时的 CSS 占位（换真图后自动隐藏） -->
      <div class="pet-ph" aria-hidden="true">
        <span class="ph-scarf"></span>
        <span class="ph-jacket"></span>
        <span class="ph-body"></span>
        <span class="ph-head"></span>
        <span class="ph-glasses"></span>
      </div>

      <!-- ============ 图层 0：肤色本体（必选，永远显示，z-index:0） ============ -->
      <!-- 【替换这里】4 款肤色，JS 会自动切换 src。
           例：src="assets/pet/body-black.png" -->
      <img class="pet-layer layer-body" id="layerBody" alt="小熊本体" />

      <!-- ============ 图层 1：围巾（可隐藏，z-index:1） ============ -->
      <!-- 【替换这里】例：src="assets/pet/scarf-check.png" -->
      <img class="pet-layer layer-scarf" id="layerScarf" alt="围巾" />

      <!-- ============ 图层 2：外套（可隐藏，z-index:2） ============ -->
      <!-- 【替换这里】例：src="assets/pet/jacket-denim.png" -->
      <img class="pet-layer layer-jacket" id="layerJacket" alt="外套" />

      <!-- ============ 图层 3：眼镜（可隐藏，z-index:3，永远最上层） ============ -->
      <!-- 【替换这里】例：src="assets/pet/glasses-vintage.png" -->
      <img class="pet-layer layer-glasses" id="layerGlasses" alt="眼镜" />

    </div>
  </div>

  <!-- ---------- 换装面板 ---------- -->
  <div class="wardrobe" id="wardrobe" hidden>
    <div class="wd-head">
      <span class="wd-title">给小引换装</span>
      <button class="wd-close" id="wdClose" title="关闭">✕</button>
    </div>

    <div class="wd-group">
      <div class="wd-group-title">肤色（必选，不能取消）</div>
      <div class="wd-row" id="rowSkin"></div>
    </div>

    <div class="wd-group">
      <div class="wd-group-title">眼镜（可不佩戴，永远最上层）</div>
      <div class="wd-row" id="rowGlasses"></div>
    </div>

    <div class="wd-group">
      <div class="wd-group-title">围巾（可不佩戴）</div>
      <div class="wd-row" id="rowScarf"></div>
    </div>

    <div class="wd-group">
      <div class="wd-group-title">外套（可不佩戴）</div>
      <div class="wd-row" id="rowJacket"></div>
    </div>

    <div class="wd-foot">
      <button class="wd-btn primary" id="wdRandom">🎲 一键随机</button>
      <button class="wd-btn" id="wdReset">恢复默认</button>
    </div>
  </div>

  <!-- ---------- 首次操作提示（可删） ---------- -->
  <div class="pet-tip" id="petTip">
    点小头像 → 大熊<br />点大熊 → <b>换装</b><br />按住可拖动
  </div>
</div>

<script>
/* ==========================================================================
   小引桌面宠物 · 换装模块（原生 JS，无任何依赖）
   --------------------------------------------------------------------------
   代码结构：
     1. 素材表 ASSETS      —— 你唯一需要改的地方（填图片路径）
     2. 选项定义 OPTIONS   —— 四个分类里有哪些款式
     3. 状态 state + 本地存储
     4. 渲染：applyLook() 把 state 同步到 4 个 <img> 图层
     5. 交互：形态切换 / 拖拽 / 眼睛跟随 / 闲置缩回
     6. 换装面板：打开、选择、随机、关闭
   ========================================================================== */

/* --------------------------------------------------------------------------
   1. 素材表：把路径填进来即可（留空 = 用 CSS 占位块演示）
   --------------------------------------------------------------------------
   要求：同一套素材尺寸完全一致、透明背景、左上角原点对齐。
   也就是说，body / scarf / jacket / glasses 四张图必须画在同一个画布尺寸上。
   -------------------------------------------------------------------------- */
var ASSETS = {
  body: {
    black: '',  /* TODO 替换：'assets/pet/body-black.png'  —— 墨黑熊 */
    white: '',  /* TODO 替换：'assets/pet/body-white.png'  —— 雪白熊 */
    brown: '',  /* TODO 替换：'assets/pet/body-brown.png'  —— 栗棕熊 */
    pink:  ''   /* TODO 替换：'assets/pet/body-pink.png'   —— 樱粉熊 */
  },
  glasses: {
    vintage:  '',  /* TODO 'assets/pet/glasses-vintage.png'  复古皮框 */
    goggle:   '',  /* TODO 'assets/pet/glasses-goggle.png'   星芒护目镜（黑框） */
    blackstar:'',  /* TODO 'assets/pet/glasses-blackstar.png' 黑框星芒 */
    whitestar:'',  /* TODO 'assets/pet/glasses-whitestar.png' 白框星芒 */
    blacksq:  '',  /* TODO 'assets/pet/glasses-blacksq.png'   黑框墨镜 */
    whitesq:  ''   /* TODO 'assets/pet/glasses-whitesq.png'   白框墨镜 */
  },
  scarf: {
    black:  '',    /* TODO 'assets/pet/scarf-black.png'  纯黑 */
    white:  '',    /* TODO 'assets/pet/scarf-white.png'  纯白 */
    check:  '',    /* TODO 'assets/pet/scarf-check.png'  黑白棋盘 */
    tip:    '',    /* TODO 'assets/pet/scarf-tip.png'    白边黑 */
    neon:   ''     /* TODO 'assets/pet/scarf-neon.png'   荧光黑 */
  },
  jacket: {
    varsity:  '',  /* TODO 'assets/pet/jacket-varsity.png'  红黑棒球服 */
    denim:    '',  /* TODO 'assets/pet/jacket-denim.png'    牛仔拼棕 */
    leather:  '',  /* TODO 'assets/pet/jacket-leather.png'  黑皮夹克 */
    cardigan: ''   /* TODO 'assets/pet/jacket-cardigan.png' 米白针织 */
  }
};

/* 每个肤色在小头像/占位块上的底色（换成真图后只影响占位块和圆形遮罩底色） */
var SKIN_COLOR = {
  black: '#2b2b33',
  white: '#f4f4f2',
  brown: '#a2704f',
  pink:  '#f4bfc8'
};

/* --------------------------------------------------------------------------
   2. 选项定义（分类 → 款式）
   none 表示「不佩戴」；肤色分类没有 none（必选）
   -------------------------------------------------------------------------- */
var OPTIONS = {
  skin: [
    { id: 'black', name: '墨黑' },
    { id: 'white', name: '雪白' },
    { id: 'brown', name: '栗棕' },
    { id: 'pink',  name: '樱粉' }
  ],
  glasses: [
    { id: 'none',      name: '不戴' },
    { id: 'vintage',   name: '复古皮框' },
    { id: 'goggle',    name: '星芒护目镜' },
    { id: 'blackstar', name: '黑框星芒' },
    { id: 'whitestar', name: '白框星芒' },
    { id: 'blacksq',   name: '黑框墨镜' },
    { id: 'whitesq',   name: '白框墨镜' }
  ],
  scarf: [
    { id: 'none',  name: '不围' },
    { id: 'black', name: '纯黑' },
    { id: 'white', name: '纯白' },
    { id: 'check', name: '黑白棋盘' },
    { id: 'tip',   name: '白边黑' },
    { id: 'neon',  name: '荧光黑' }
  ],
  jacket: [
    { id: 'none',     name: '不穿' },
    { id: 'varsity',  name: '红黑棒球服' },
    { id: 'denim',    name: '牛仔拼棕' },
    { id: 'leather',  name: '黑皮夹克' },
    { id: 'cardigan', name: '米白针织' }
  ]
};

/* --------------------------------------------------------------------------
   3. 状态 + 本地存储
   -------------------------------------------------------------------------- */
var STORE_LOOK = 'pet_look_v1';   /* 穿搭 */
var STORE_FORM = 'pet_form_v1';   /* 形态：'mini' | 'big' */
var STORE_POS  = 'pet_pos_v1';    /* 位置：小头像 / 大熊 */

var DEFAULT_LOOK = { skin: 'black', glasses: 'none', scarf: 'none', jacket: 'none' };

var state = {
  look: { skin: DEFAULT_LOOK.skin, glasses: 'none', scarf: 'none', jacket: 'none' },
  form: 'mini',
  /* 小头像位置（相对视口右下角的偏移，单位 px） */
  miniPos: { right: 26, bottom: 26 },
  /* 大熊位置（相对挂件锚点的偏移，单位 px；0/0 = 默认位置） */
  bigPos: { dx: 0, dy: 0 }
};

function loadStore() {
  try {
    var savedLook = JSON.parse(localStorage.getItem(STORE_LOOK) || 'null');
    if (savedLook && savedLook.skin) {
      state.look.skin = savedLook.skin || DEFAULT_LOOK.skin;
      state.look.glasses = savedLook.glasses || 'none';
      state.look.scarf = savedLook.scarf || 'none';
      state.look.jacket = savedLook.jacket || 'none';
    }
  } catch (e) { /* 数据损坏就忽略，用默认值 */ }

  try {
    var form = localStorage.getItem(STORE_FORM);
    if (form === 'big' || form === 'mini') state.form = form;
  } catch (e) {}

  try {
    var pos = JSON.parse(localStorage.getItem(STORE_POS) || 'null');
    if (pos) {
      if (pos.miniPos) state.miniPos = pos.miniPos;
      if (pos.bigPos) state.bigPos = pos.bigPos;
    }
  } catch (e) {}
}

function saveLook() {
  try { localStorage.setItem(STORE_LOOK, JSON.stringify(state.look)); } catch (e) {}
}
function saveForm() {
  try { localStorage.setItem(STORE_FORM, state.form); } catch (e) {}
}
function savePos() {
  try {
    localStorage.setItem(STORE_POS, JSON.stringify({
      miniPos: state.miniPos,
      bigPos: state.bigPos
    }));
  } catch (e) {}
}

/* --------------------------------------------------------------------------
   4. 渲染：把 state.look 同步到 4 个图层 <img>
   --------------------------------------------------------------------------
   关键点：每层只是「换 src / 显隐」，永远不做位移，靠透明图层叠加出穿着效果。
   -------------------------------------------------------------------------- */
var el = {};   /* DOM 引用集合 */

function pickSrc(group, id) {
  if (!id || id === 'none') return '';
  return (ASSETS[group] && ASSETS[group][id]) || '';
}

function setLayer(img, src) {
  /* src 为空 → 隐藏该层（用 visibility 而不是 hidden，
     这样既不会显示破图标/alt 文案，又不会影响布局尺寸） */
  if (!src) {
    img.removeAttribute('src');
    img.hidden = true;
    img.style.visibility = 'hidden';
    return;
  }
  if (img.getAttribute('src') !== src) img.setAttribute('src', src);
  img.hidden = false;
  img.style.visibility = '';
}

function applyLook() {
  var look = state.look;

  /* ---- 图层 0：肤色本体（必选，永远显示） ---- */
  var bodySrc = pickSrc('body', look.skin);
  setLayer(el.layerBody, bodySrc);
  /* 本体没有图片时，用 CSS 占位块顶上（见下方 is-placeholder 逻辑） */

  /* ---- 图层 1：围巾 ---- */
  setLayer(el.layerScarf, pickSrc('scarf', look.scarf));

  /* ---- 图层 2：外套 ---- */
  setLayer(el.layerJacket, pickSrc('jacket', look.jacket));

  /* ---- 图层 3：眼镜（永远最上层） ---- */
  setLayer(el.layerGlasses, pickSrc('glasses', look.glasses));

  /* 是否处于「没有图片、用 CSS 占位」的状态 */
  var noImages = !bodySrc;
  el.petStage.classList.toggle('is-placeholder', noImages);

  /* 占位块按当前穿搭显示/隐藏（仅占位模式生效） */
  el.phScarf.style.display  = (!noImages || look.scarf === 'none')   ? 'none' : 'block';
  el.phJacket.style.display = (!noImages || look.jacket === 'none')  ? 'none' : 'block';
  el.phGlasses.style.display= (!noImages || look.glasses === 'none') ? 'none' : 'block';

  /* 占位块的颜色跟肤色走 */
  el.petStage.style.setProperty('--skin-color', SKIN_COLOR[look.skin] || '#2b2b33');

  /* 小头像：真图模式下用本体图放大裁切；占位模式下显示 CSS 头 */
  if (!noImages) {
    if (el.miniHeadImg.getAttribute('src') !== bodySrc) el.miniHeadImg.setAttribute('src', bodySrc);
    el.miniHeadImg.style.display = 'block';
    el.miniPh.style.display = 'none';
  } else {
    el.miniHeadImg.style.display = 'none';
    el.miniPh.style.display = 'block';
    el.miniPh.style.setProperty('--skin-color', SKIN_COLOR[look.skin] || '#2b2b33');
  }

  /* 面板里的选中态同步 */
  syncWardrobeSelection();
}

/* --------------------------------------------------------------------------
   5. 交互
   -------------------------------------------------------------------------- */

/* 5.1 形态切换：小头像 ↔ 大熊 */
function setForm(form, opts) {
  var quiet = opts && opts.quiet;
  state.form = form;

  if (form === 'big') {
    el.petBig.hidden = false;
    el.petMini.style.display = 'none';
    el.petTip.hidden = true;
    restoreBigPos();
    startIdleWatch();          /* 开始计时：长时间不动就缩回去 */
  } else {
    el.petBig.hidden = true;
    el.petWardrobe.hidden = true;
    el.petMini.style.display = '';
    hideTip();
    stopIdleWatch();
  }

  if (!quiet) saveForm();
}

/* 5.2 位置：小头像 / 大熊 */
function applyMiniPos() {
  var p = state.miniPos || { right: 26, bottom: 26 };
  /* 限制在视口内，避免拖出屏幕 */
  var maxRight = Math.max(6, window.innerWidth - 84 - 6);
  var maxBottom = Math.max(6, window.innerHeight - 84 - 6);
  p.right = Math.min(Math.max(6, p.right), maxRight);
  p.bottom = Math.min(Math.max(6, p.bottom), maxBottom);
  state.miniPos = p;
  el.pet.style.right = p.right + 'px';
  el.pet.style.bottom = p.bottom + 'px';
}

function applyBigPos() {
  var b = state.bigPos || { dx: 0, dy: 0 };
  el.petBig.style.transform = '';           /* 让 JS 位移不受 CSS transform 干扰 */
  el.petBig.style.left = b.dx + 'px';
  el.petBig.style.top  = b.dy + 'px';
  el.petBig.style.right = 'auto';
  el.petBig.style.bottom = 'auto';
  clampBigPos();
}

/* 大熊位移后做一次视口钳制，保证整只熊还在屏幕里 */
function clampBigPos() {
  var rect = el.petBig.getBoundingClientRect();
  var dx = state.bigPos.dx, dy = state.bigPos.dy;
  var changed = false;

  if (rect.left < 4) { dx += (4 - rect.left); changed = true; }
  if (rect.right > window.innerWidth - 4) { dx -= (rect.right - (window.innerWidth - 4)); changed = true; }
  if (rect.top < 4) { dy += (4 - rect.top); changed = true; }
  if (rect.bottom > window.innerHeight - 4) { dy -= (rect.bottom - (window.innerHeight - 4)); changed = true; }

  if (changed) {
    state.bigPos.dx = dx;
    state.bigPos.dy = dy;
    el.petBig.style.left = dx + 'px';
    el.petBig.style.top  = dy + 'px';
    savePos();
  }
}

function restoreBigPos() {
  var b = state.bigPos || { dx: 0, dy: 0 };
  el.petBig.style.left = b.dx + 'px';
  el.petBig.style.top  = b.dy + 'px';
  el.petBig.style.right = 'auto';
  el.petBig.style.bottom = 'auto';
  /* 如果上次拖到屏幕外（换了更小的窗口），自动拉回 */
  setTimeout(clampBigPos, 0);
}

function resetBigPos() {
  state.bigPos = { dx: 0, dy: 0 };
  el.petBig.style.left = '0px';
  el.petBig.style.top = '0px';
  savePos();
}

/* 5.3 拖拽
   —— 小头像：移动整个挂件（.pet 的 right/bottom）
   —— 大熊：只移动大熊自己（.pet-big 的 left/top），聊天/面板不受影响
*/
function bindDrag(handle, onStart, onMove, onEnd) {
  var dragging = false;
  var startX = 0, startY = 0;
  var origin = null;

  handle.addEventListener('pointerdown', function (e) {
    if (e.button !== 0) return;
    dragging = true;
    startX = e.clientX;
    startY = e.clientY;
    origin = onStart();
    handle.setPointerCapture && handle.setPointerCapture(e.pointerId);
    e.preventDefault();
  });

  handle.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    onMove(e.clientX - startX, e.clientY - startY, origin);
  });

  function up(e) {
    if (!dragging) return;
    dragging = false;
    handle.releasePointerCapture && handle.releasePointerCapture(e.pointerId);
    onEnd && onEnd();
  }
  handle.addEventListener('pointerup', up);
  handle.addEventListener('pointercancel', up);
}

/* 5.4 眼睛跟随鼠标：对整只熊做轻微透视偏转（不依赖素材瞳孔位置） */
var eyeTimer = null;
function followEyes(e) {
  if (state.form !== 'big') return;
  if (eyeTimer) return;
  eyeTimer = setTimeout(function () {
    eyeTimer = null;
    var rect = el.petBig.getBoundingClientRect();
    var cx = rect.left + rect.width / 2;
    var cy = rect.top + rect.height * 0.3;   /* 头部大致位置 */
    var dx = e.clientX - cx;
    var dy = e.clientY - cy;
    var maxRy = 7, maxRx = 5;
    var ry = Math.max(-maxRy, Math.min(maxRy, dx / 40));
    var rx = Math.max(-maxRx, Math.min(maxRx, -dy / 40));
    el.petBig.style.setProperty('--ry', ry.toFixed(2) + 'deg');
    el.petBig.style.setProperty('--rx', rx.toFixed(2) + 'deg');
  }, 40);
}

/* 5.5 闲置缩回小头像 */
var IDLE_MS = 12000;
var idleTimer = null;

function startIdleWatch() {
  stopIdleWatch();
  idleTimer = setTimeout(function () {
    if (state.form !== 'big') return;
    setForm('mini');       /* 自动缩回小头像 */
  }, IDLE_MS);
}
function resetIdleWatch() {
  if (state.form === 'big') startIdleWatch();
}
function stopIdleWatch() {
  if (idleTimer) { clearTimeout(idleTimer); idleTimer = null; }
}

/* 5.6 首次提示 */
function hideTip() {
  if (el.petTip) el.petTip.hidden = true;
  try { localStorage.setItem('pet_tip_seen_v1', '1'); } catch (e) {}
}

/* --------------------------------------------------------------------------
   6. 换装面板
   -------------------------------------------------------------------------- */
var rowMap = {
  skin:    { el: null, key: 'skin',    group: 'skin' },
  glasses: { el: null, key: 'glasses', group: 'glasses' },
  scarf:   { el: null, key: 'scarf',   group: 'scarf' },
  jacket:  { el: null, key: 'jacket',  group: 'jacket' }
};

function buildWardrobe() {
  ['skin', 'glasses', 'scarf', 'jacket'].forEach(function (cat) {
    var row = el['row' + cat.charAt(0).toUpperCase() + cat.slice(1)];
    if (!row) return;
    row.innerHTML = '';

    OPTIONS[cat].forEach(function (opt) {
      var btn = document.createElement('button');
      btn.className = 'wd-opt';
      btn.type = 'button';
      btn.setAttribute('data-cat', cat);
      btn.setAttribute('data-id', opt.id);

      if (opt.id === 'none') {
        btn.innerHTML = '<span class="none-mark">✕</span><span>' + opt.name + '</span>';
      } else if (cat === 'skin') {
        btn.innerHTML = '<span class="dot" style="background:' + (SKIN_COLOR[opt.id] || '#ccc') + '"></span><span>' + opt.name + '</span>';
      } else {
        btn.innerHTML = '<span>' + opt.name + '</span>';
      }

      btn.addEventListener('click', function (ev) {
        ev.stopPropagation();     /* 别让点击冒泡去关闭面板 */
        selectOption(cat, opt.id);
      });

      row.appendChild(btn);
    });
  });
}

function selectOption(cat, id) {
  if (cat === 'skin') {
    if (id === 'none') return;           /* 肤色必选，忽略 */
    state.look.skin = id;
  } else {
    state.look[cat] = id;                /* 允许 'none'（不佩戴） */
  }
  applyLook();                           /* 图层只在 applyLook 里变 */
  saveLook();
  resetIdleWatch();                      /* 有操作，重置闲置计时 */
}

function syncWardrobeSelection() {
  var btns = el.petWardrobe.querySelectorAll('.wd-opt');
  for (var i = 0; i < btns.length; i++) {
    var b = btns[i];
    var cat = b.getAttribute('data-cat');
    var id = b.getAttribute('data-id');
    var on = (cat === 'skin')
      ? (state.look.skin === id)
      : (state.look[cat] === id);
    b.classList.toggle('is-on', !!on);
  }
}

function openWardrobe() {
  el.petWardrobe.hidden = false;
  syncWardrobeSelection();
  resetIdleWatch();
}
function closeWardrobe() {
  el.petWardrobe.hidden = true;
}
function toggleWardrobe() {
  if (el.petWardrobe.hidden) openWardrobe(); else closeWardrobe();
}

/* 一键随机：肤色随机（必选），三类配饰各自随机（可能随机到 none） */
function randomLook() {
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)].id; }

  state.look.skin = pick(OPTIONS.skin);                 /* 肤色一定挑到具体一款 */
  state.look.glasses = pick(OPTIONS.glasses);           /* 可能是 'none' */
  state.look.scarf = pick(OPTIONS.scarf);
  state.look.jacket = pick(OPTIONS.jacket);

  applyLook();
  saveLook();
  resetIdleWatch();
}

function resetLook() {
  state.look = { skin: DEFAULT_LOOK.skin, glasses: 'none', scarf: 'none', jacket: 'none' };
  applyLook();
  saveLook();
  resetIdleWatch();
}

/* --------------------------------------------------------------------------
   7. 初始化
   -------------------------------------------------------------------------- */
function init() {
  /* 7.1 缓存 DOM */
  el.pet        = document.getElementById('pet');
  el.petMini    = document.getElementById('petMini');
  el.petBig     = document.getElementById('petBig');
  el.petStage   = document.getElementById('petStage');
  el.petWardrobe= document.getElementById('wardrobe');
  el.petTip     = document.getElementById('petTip');

  el.layerBody    = document.getElementById('layerBody');
  el.layerScarf   = document.getElementById('layerScarf');
  el.layerJacket  = document.getElementById('layerJacket');
  el.layerGlasses = document.getElementById('layerGlasses');

  el.miniHeadImg = document.getElementById('miniHeadImg');
  el.miniPh      = document.getElementById('miniPh');

  el.phScarf   = el.petStage.querySelector('.ph-scarf');
  el.phJacket  = el.petStage.querySelector('.ph-jacket');
  el.phGlasses = el.petStage.querySelector('.ph-glasses');

  el.rowSkin    = document.getElementById('rowSkin');
  el.rowGlasses = document.getElementById('rowGlasses');
  el.rowScarf   = document.getElementById('rowScarf');
  el.rowJacket  = document.getElementById('rowJacket');

  /* 7.2 读本地存储 + 首次渲染 */
  loadStore();
  applyMiniPos();
  applyLook();
  buildWardrobe();

  /* 7.3 形态：默认小头像；上次是大熊就恢复成大熊 */
  setForm(state.form === 'big' ? 'big' : 'mini', { quiet: true });

  /* 7.4 小头像点一下 → 变大熊 */
  el.petMini.addEventListener('click', function (e) {
    e.stopPropagation();
    setForm('big');
  });

  /* 7.5 小头像拖拽 = 移动整个挂件 */
  bindDrag(el.petMini,
    function () { return { right: state.miniPos.right, bottom: state.miniPos.bottom }; },
    function (dx, dy, origin) {
      state.miniPos.right = origin.right - dx;    /* 往右拖 → right 变小 */
      state.miniPos.bottom = origin.bottom - dy;
      applyMiniPos();
    },
    function () { savePos(); }
  );
  /* 拖拽和点击要区分：移动超过 4px 就标记为「拖动过」，不让它触发展开 */
  var miniMoved = false;
  el.petMini.addEventListener('pointerdown', function () { miniMoved = false; });
  el.petMini.addEventListener('pointermove', function (e) {
    if (e.buttons === 1) miniMoved = true;
  });
  el.petMini.addEventListener('click', function (e) {
    if (miniMoved) { e.stopImmediatePropagation(); miniMoved = false; }
  }, true);

  /* 7.6 大熊：拖拽 = 只移动大熊；单击 = 换装；双击 = 回默认位置 */
  var bigMoved = false;
  var downAt = null;

  el.petBig.addEventListener('pointerdown', function (e) {
    bigMoved = false;
    downAt = { x: e.clientX, y: e.clientY };
    resetIdleWatch();
  });

  bindDrag(el.petBig,
    function () { return { dx: state.bigPos.dx, dy: state.bigPos.dy }; },
    function (dx, dy, origin) {
      if (Math.abs(dx) > 4 || Math.abs(dy) > 4) bigMoved = true;
      state.bigPos.dx = origin.dx + dx;
      state.bigPos.dy = origin.dy + dy;
      el.petBig.style.left = state.bigPos.dx + 'px';
      el.petBig.style.top  = state.bigPos.dy + 'px';
      el.petBig.style.right = 'auto';
      el.petBig.style.bottom = 'auto';
    },
    function () {
      if (bigMoved) { clampBigPos(); savePos(); }
    }
  );

  el.petBig.addEventListener('click', function (e) {
    if (bigMoved) return;                 /* 拖动结束的那一次 click 要忽略 */
    e.stopPropagation();
    toggleWardrobe();
  });

  el.petBig.addEventListener('dblclick', function (e) {
    e.stopPropagation();
    resetBigPos();
  });

  /* 7.7 换装面板按钮 */
  document.getElementById('wdClose').addEventListener('click', function (e) {
    e.stopPropagation(); closeWardrobe();
  });
  document.getElementById('wdRandom').addEventListener('click', function (e) {
    e.stopPropagation(); randomLook();
  });
  document.getElementById('wdReset').addEventListener('click', function (e) {
    e.stopPropagation(); resetLook();
  });

  /* 7.8 点页面空白处关闭面板（点面板内部不关） */
  document.addEventListener('click', function (e) {
    if (el.petWardrobe.hidden) return;
    if (el.petWardrobe.contains(e.target)) return;
    if (el.petBig.contains(e.target)) return;      /* 点熊本体交给 7.6 的 toggle 处理 */
    closeWardrobe();
  });

  /* 7.9 眼睛跟随鼠标 */
  document.addEventListener('mousemove', followEyes);

  /* 7.10 用户操作时重置闲置计时（移动鼠标 / 按键 / 滚动都算） */
  document.addEventListener('mousemove', resetIdleWatch);
  document.addEventListener('keydown', resetIdleWatch);
  window.addEventListener('scroll', resetIdleWatch, { passive: true });

  /* 7.11 窗口尺寸变化时把位置拉回视口内 */
  window.addEventListener('resize', function () {
    applyMiniPos();
    if (state.form === 'big') clampBigPos();
  });

  /* 7.12 关页前再存一次位置（防止刚拖完就关） */
  window.addEventListener('pagehide', function () {
    savePos();
    saveLook();
    saveForm();
  });

  /* 7.13 首次打开给个提示，点一下小头像后就再也不出现 */
  if (localStorage.getItem('pet_tip_seen_v1') === '1') el.petTip.hidden = true;
}

/* 等 DOM 就绪再启动 */
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
